  <style>

    /* Quitar botones VR */

    /* MENSAJE SUPERIOR                                      */
    /* ===================================================== */

    /* ===================================================== */

  <script>


    /* ===================================================== */
    /* TRIÁNGULO RECTÁNGULO                                  */
    /* ===================================================== */

    AFRAME.registerComponent(

      "triangulo-revolucion",

      {

        init: function () {


          const figura =
            new THREE.Shape();


          figura.moveTo(
            0,
            -0.22
          );


          figura.lineTo(
            0,
            0.22
          );


          figura.lineTo(
            0.28,
            -0.22
          );


          figura.closePath();



          const geometria =
            new THREE.ShapeGeometry(
              figura
            );



          const material =
            new THREE.MeshBasicMaterial({

              color:
                0xB88932,

              side:
                THREE.DoubleSide,

              transparent:
                true,

              opacity:
                0.94

            });



          const mesh =
            new THREE.Mesh(

              geometria,

              material

            );


          this.el.setObject3D(

            "mesh",

            mesh

          );


        }

      }

    );



    /* ===================================================== */
    /* SEMICÍRCULO                                           */
    /* ===================================================== */

    AFRAME.registerComponent(

      "semicirculo-revolucion",

      {

        init: function () {


          const radio =
            0.24;


          const figura =
            new THREE.Shape();


          figura.moveTo(

            0,

            -radio

          );



          const pasos =
            50;



          for (

            let i = 0;

            i <= pasos;

            i++

          ) {


            const angulo =

              -Math.PI / 2

              +

              Math.PI *
              i /
              pasos;



            const x =

              radio *
              Math.cos(
                angulo
              );


            const y =

              radio *
              Math.sin(
                angulo
              );



            figura.lineTo(

              x,

              y

            );


          }



          figura.lineTo(

            0,

            -radio

          );


          figura.closePath();



          const geometria =
            new THREE.ShapeGeometry(
              figura
            );



          const material =
            new THREE.MeshBasicMaterial({

              color:
                0xB88932,

              side:
                THREE.DoubleSide,

              transparent:
                true,

              opacity:
                0.94

            });



          const mesh =
            new THREE.Mesh(

              geometria,

              material

            );



          this.el.setObject3D(

            "mesh",

            mesh

          );


        }

      }

    );



    /* ===================================================== */
    /* GENERATRIZ CURVA DEL SEMICÍRCULO                      */
    /* ===================================================== */

    AFRAME.registerComponent(

      "arco-generatriz",

      {

        init: function () {


          const radio =
            0.24;


          const puntos =
            [];


          const pasos =
            50;



          for (

            let i = 0;

            i <= pasos;

            i++

          ) {


            const angulo =

              -Math.PI / 2

              +

              Math.PI *
              i /
              pasos;



            puntos.push(

              new THREE.Vector3(

                radio *
                Math.cos(
                  angulo
                ),

                radio *
                Math.sin(
                  angulo
                ),

                0.012

              )

            );


          }



          const geometria =
            new THREE.BufferGeometry()
              .setFromPoints(
                puntos
              );



          const material =
            new THREE.LineBasicMaterial({

              color:
                0x7A1F1F

            });



          const linea =
            new THREE.Line(

              geometria,

              material

            );



          this.el.setObject3D(

            "mesh",

            linea

          );


        }

      }

    );


  </script>


</head>

          "#textoEjeSemicirculo"
        ),

      rastros:
        document.querySelector(
          "#rastrosSemicirculo"
        ),

      solido3D:
        document.querySelector(
          "#solidoSemicirculo"
        ),

      relleno:
        document.querySelector(
          "#rellenoSemicirculo"
        ),

      resultado:
        document.querySelector(
          "#resultadoSemicirculo"
        ),

      timerRastro:
        null

    },



    rectangulo: {

      nombre:
        "Rectángulo",

      solido:
        "Cilindro",

      target:
        document.querySelector(
          "#targetRectangulo"
        ),

      rotor:
        document.querySelector(
          "#rotorRectangulo"
        ),

      figura:
        document.querySelector(
          "#figuraRectangulo"
        ),

      generatriz:
        document.querySelector(
          "#generatrizRectangulo"
        ),

      eje:
        document.querySelector(
          "#ejeRectangulo"
        ),

      textoEje:
        document.querySelector(
          "#textoEjeRectangulo"
        ),

      rastros:
        document.querySelector(
          "#rastrosRectangulo"
        ),

      solido3D:
        document.querySelector(
          "#solidoRectangulo"
        ),

      relleno:
        document.querySelector(
          "#rellenoRectangulo"
        ),

      resultado:
        document.querySelector(
          "#resultadoRectangulo"
        ),

      timerRastro:
        null

    },



    triangulo: {

      nombre:
        "Triángulo",

      solido:
        "Cono",

      target:
        document.querySelector(
          "#targetTriangulo"
        ),

      rotor:
        document.querySelector(
          "#rotorTriangulo"
        ),

      figura:
        document.querySelector(
          "#figuraTriangulo"
        ),

      generatriz:
        document.querySelector(
          "#generatrizTriangulo"
        ),

      eje:
        document.querySelector(
          "#ejeTriangulo"
        ),

      textoEje:
        document.querySelector(
          "#textoEjeTriangulo"
        ),

      rastros:
        document.querySelector(
          "#rastrosTriangulo"
        ),

      solido3D:
        document.querySelector(
          "#solidoTriangulo"
        ),

      relleno:
        document.querySelector(
          "#rellenoTriangulo"
        ),

      resultado:
        document.querySelector(
          "#resultadoTriangulo"
        ),

      timerRastro:
        null

    }


  };



  let escenaActual =
    null;



  /* ===================================================== */
  /* BOTONES                                               */
  /* ===================================================== */


  function habilitarBotones(
    activo
  ) {


    botones.forEach(

      boton => {


        boton.disabled =
          !activo;


      }

    );


  }



  /* ===================================================== */
  /* GENERATRIZ                                            */
  /* ===================================================== */


  function mostrarGeneratriz(
    escena
  ) {


    if (!escena) {

      return;

    }



    escena.generatriz.setAttribute(

      "visible",

      true

    );


    escena.eje.setAttribute(

      "visible",

      true

    );


    escena.textoEje.setAttribute(

      "visible",

      true

    );



    estado.textContent =

      "Observa la generatriz y el eje de giro";


  }



  /* ===================================================== */
  /* LIMPIAR RASTROS                                       */
  /* ===================================================== */


  function limpiarRastros(
    escena
  ) {


    if (!escena) {

      return;

    }



    const contenedor =
      escena.rastros.object3D;



    while (
      contenedor.children.length > 0
    ) {


      contenedor.remove(

        contenedor.children[0]

      );


    }


  }



  /* ===================================================== */
  /* CREAR RASTRO                                          */
  /* ===================================================== */


  function crearRastro(
    escena
  ) {


    if (
      !escena ||
      !escena.figura.object3D
    ) {

      return;

    }



    const copiaFigura =
      escena.figura.object3D.clone(
        true
      );



    const materiales =
      [];



    copiaFigura.traverse(

      objeto => {


        if (
          objeto.material
        ) {


          objeto.material =
            objeto.material.clone();


          objeto.material.transparent =
            true;


          objeto.material.opacity =
            OPACIDAD_RASTRO;


          materiales.push(
            objeto.material
          );


        }


      }

    );



    const fantasma =
      new THREE.Group();



    fantasma.rotation.copy(

      escena.rotor.object3D.rotation

    );



    fantasma.add(

      copiaFigura

    );



    escena.rastros.object3D.add(

      fantasma

    );



    const inicio =
      performance.now();



    function desaparecer(
      ahora
    ) {


      const progreso =

        (
          ahora -
          inicio
        )

        /

        DURACION_RASTRO;



      const opacidad =

        Math.max(

          0,

          OPACIDAD_RASTRO *
          (
            1 -
            progreso
          )

        );



      materiales.forEach(

        material => {


          material.opacity =
            opacidad;


        }

      );



      if (
        progreso <
        1
      ) {


        requestAnimationFrame(
          desaparecer
        );


      }

      else {


        escena.rastros.object3D.remove(

          fantasma

        );


      }


    }



    requestAnimationFrame(

      desaparecer

    );


  }



  /* ===================================================== */
  /* DETENER MOTOR                                         */
  /* ===================================================== */


  function detenerMotor(
    escena
  ) {


    if (!escena) {

      return;

    }



    escena.rotor.removeAttribute(

      "animation__giro"

    );



    if (
      escena.timerRastro
    ) {


      clearInterval(

        escena.timerRastro

      );


      escena.timerRastro =
        null;


    }


  }



  /* ===================================================== */
  /* GIRAR                                                 */
  /* ===================================================== */


  function girar(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    escena.rotor.setAttribute(

      "rotation",

      "0 0 0"

    );



    limpiarRastros(
      escena
    );



    /*
    No mostramos todavía
    el sólido final.
    */

    escena.solido3D.setAttribute(

      "visible",

      false

    );


    escena.resultado.setAttribute(

      "visible",

      false

    );



    mostrarGeneratriz(
      escena
    );



    escena.rotor.setAttribute(

      "animation__giro",

      {

        property:
          "rotation",

        from:
          "0 0 0",

        to:
          "0 360 0",

        dur:
          VELOCIDAD_GIRO,

        easing:
          "linear",

        loop:
          true

      }

    );



    escena.timerRastro =
      setInterval(

        () => {


          crearRastro(
            escena
          );


        },

        INTERVALO_RASTRO

      );



    estado.textContent =

      escena.nombre

      +

      " girando... observa el barrido";


  }



  /* ===================================================== */
  /* DETENER                                               */
  /* ===================================================== */


  function detener(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    escena.solido3D.setAttribute(

      "visible",

      false

    );


    escena.resultado.setAttribute(

      "visible",

      false

    );



    estado.textContent =

      "Giro detenido. ¿Qué sólido se formó?";


  }



  /* ===================================================== */
  /* VER SÓLIDO                                            */
  /* ===================================================== */


  function verSolido(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    escena.solido3D.setAttribute(

      "visible",

      true

    );



    escena.relleno.setAttribute(

      "material",

      "opacity",

      0.05

    );



    escena.relleno.setAttribute(

      "animation__aparecer",

      {

        property:
          "material.opacity",

        from:
          0.05,

        to:
          0.48,

        dur:
          650,

        easing:
          "easeOutQuad"

      }

    );



    escena.resultado.setAttribute(

      "visible",

      true

    );



    estado.textContent =

      "Resultado: "

      +

      escena.solido;


  }



  /* ===================================================== */
  /* REINICIAR                                             */
  /* ===================================================== */


  function reiniciarEscena(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    limpiarRastros(
      escena
    );



    escena.rotor.setAttribute(

      "rotation",

      "0 0 0"

    );



    escena.generatriz.setAttribute(

      "visible",

      false

    );


    escena.eje.setAttribute(

      "visible",

      false

    );


    escena.textoEje.setAttribute(

      "visible",

      false

    );



    escena.solido3D.setAttribute(

      "visible",

      false

    );


    escena.resultado.setAttribute(

      "visible",

      false

    );



    escena.relleno.removeAttribute(

      "animation__aparecer"

    );



    estado.textContent =

      escena.nombre

      +

      " detectado ✓";


  }



  /* ===================================================== */
  /* TARGETS                                               */
  /* ===================================================== */


  function prepararTarget(
    escena
  ) {


    escena.target.addEventListener(

      "targetFound",

      () => {


        escenaActual =
          escena;


        habilitarBotones(
          true
        );


        estado.textContent =

          escena.nombre

          +

          " detectado ✓";


      }

    );



    escena.target.addEventListener(

      "targetLost",

      () => {


        if (
          escenaActual ===
          escena
        ) {


          reiniciarEscena(
            escena
          );


          escenaActual =
            null;


          habilitarBotones(
            false
          );


          estado.textContent =

            "Enfoca una de las tres figuras";


        }


      }

    );


  }



  prepararTarget(

    escenas.semicirculo

  );


  prepararTarget(

    escenas.rectangulo

  );


  prepararTarget(

    escenas.triangulo

  );



  /* ===================================================== */
  /* EVENTOS DE BOTONES                                     */
  /* ===================================================== */


  btnGeneratriz.addEventListener(

    "click",

    () => {


      mostrarGeneratriz(

        escenaActual

      );


    }

  );



  btnGirar.addEventListener(

    "click",

    () => {


      girar(

        escenaActual

      );


    }

  );



  btnDetener.addEventListener(

    "click",

    () => {


      detener(

        escenaActual

      );


    }

  );



  btnSolido.addEventListener(

    "click",

    () => {


      verSolido(

        escenaActual

      );


    }

  );



  btnReiniciar.addEventListener(

    "click",

    () => {


      reiniciarEscena(

        escenaActual

      );


    }

  );



  /* ESTADO INICIAL */

  habilitarBotones(
    false
  );


</script>


</body>

</html>
