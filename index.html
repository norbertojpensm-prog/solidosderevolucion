<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Sólidos de Revolución</title>


  <!-- ===================================================== -->
  <!-- A-FRAME                                               -->
  <!-- ===================================================== -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- ===================================================== -->
  <!-- MINDAR                                                -->
  <!-- ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }



    /* ===================================================== */
    /* QUITAR BOTÓN VR                                       */
    /* ===================================================== */

    .a-enter-vr,
    .a-enter-vr-button,
    .a-enter-ar,
    .a-enter-ar-button {

      display: none !important;

    }



    /* ===================================================== */
    /* MENSAJE SUPERIOR                                      */
    /* ===================================================== */

    #estado {

      position: fixed;

      top: 12px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 9999;

      padding:
        10px 15px;

      border-radius:
        14px;

      background:
        rgba(20, 42, 31, 0.88);

      color:
        white;

      font-size:
        14px;

      font-weight:
        bold;

      text-align:
        center;

      white-space:
        nowrap;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.30);

    }



    /* ===================================================== */
    /* BOTONES                                               */
    /* ===================================================== */

    #controles {

      position: fixed;

      bottom: 17px;

      left: 0;
      right: 0;

      z-index: 9999;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      padding:
        0 10px;

    }



    button {

      border:
        2px solid
        rgba(255,255,255,0.82);

      border-radius:
        18px;

      padding:
        13px 15px;

      min-width:
        125px;

      background:
        #1F6B45;

      color:
        white;

      font-size:
        13px;

      font-weight:
        bold;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.40);

      cursor:
        pointer;

      transition:
        opacity 0.20s,
        transform 0.10s,
        background 0.20s;

    }



    /*
    Mientras NO exista un target detectado:

    los botones permanecen visibles,
    pero se ven atenuados y no funcionan.
    */

    button:disabled {

      opacity:
        0.23;

      cursor:
        default;

    }



    button:not(:disabled):active {

      transform:
        scale(0.95);

      background:
        #174E34;

    }



  </style>



  <script>


    /* ===================================================== */
    /* TRIÁNGULO RECTÁNGULO                                  */
    /* ===================================================== */

    AFRAME.registerComponent(

      "triangulo-revolucion",

      {

        init: function () {


          const figura =
            new THREE.Shape();



          /*
                    ●
                    |\
                    | \
          EJE  ---> |  \  <--- GENERATRIZ
                    |   \
                    |____\
          */


          figura.moveTo(
            0,
            -0.22
          );


          figura.lineTo(
            0,
            0.22
          );


          figura.lineTo(
            0.28,
            -0.22
          );


          figura.closePath();



          const geometria =
            new THREE.ShapeGeometry(
              figura
            );



          const material =
            new THREE.MeshBasicMaterial({

              color:
                0xB88932,

              side:
                THREE.DoubleSide,

              transparent:
                true,

              opacity:
                0.94

            });



          const mesh =
            new THREE.Mesh(

              geometria,

              material

            );


          this.el.setObject3D(

            "mesh",

            mesh

          );


        }

      }

    );



    /* ===================================================== */
    /* SEMICÍRCULO                                           */
    /* ===================================================== */

    AFRAME.registerComponent(

      "semicirculo-revolucion",

      {

        init: function () {


          const radio =
            0.24;


          const figura =
            new THREE.Shape();



          figura.moveTo(

            0,

            -radio

          );



          const pasos =
            50;



          for (

            let i = 0;

            i <= pasos;

            i++

          ) {


            const angulo =

              -Math.PI / 2

              +

              Math.PI *
              i /
              pasos;



            const x =

              radio *
              Math.cos(
                angulo
              );


            const y =

              radio *
              Math.sin(
                angulo
              );



            figura.lineTo(

              x,

              y

            );


          }



          figura.lineTo(

            0,

            -radio

          );


          figura.closePath();



          const geometria =
            new THREE.ShapeGeometry(
              figura
            );



          const material =
            new THREE.MeshBasicMaterial({

              color:
                0xB88932,

              side:
                THREE.DoubleSide,

              transparent:
                true,

              opacity:
                0.94

            });



          const mesh =
            new THREE.Mesh(

              geometria,

              material

            );



          this.el.setObject3D(

            "mesh",

            mesh

          );


        }

      }

    );



    /* ===================================================== */
    /* GENERATRIZ CURVA DEL SEMICÍRCULO                      */
    /* ===================================================== */

    AFRAME.registerComponent(

      "arco-generatriz",

      {

        init: function () {


          const radio =
            0.24;


          const puntos =
            [];


          const pasos =
            50;



          for (

            let i = 0;

            i <= pasos;

            i++

          ) {


            const angulo =

              -Math.PI / 2

              +

              Math.PI *
              i /
              pasos;



            puntos.push(

              new THREE.Vector3(

                radio *
                Math.cos(
                  angulo
                ),

                radio *
                Math.sin(
                  angulo
                ),

                0.012

              )

            );


          }



          const geometria =
            new THREE.BufferGeometry()
              .setFromPoints(
                puntos
              );



          const material =
            new THREE.LineBasicMaterial({

              color:
                0x7A1F1F

            });



          const linea =
            new THREE.Line(

              geometria,

              material

            );



          this.el.setObject3D(

            "mesh",

            linea

          );


        }

      }

    );


  </script>


</head>



<body>

<script>


  /* ===================================================== */
  /* BOTONES                                               */
  /* ===================================================== */


  const btnGeneratriz =
    document.querySelector(
      "#btnGeneratriz"
    );


  const btnGirar =
    document.querySelector(
      "#btnGirar"
    );


  const btnDetener =
    document.querySelector(
      "#btnDetener"
    );


  const btnSolido =
    document.querySelector(
      "#btnSolido"
    );


  const btnReiniciar =
    document.querySelector(
      "#btnReiniciar"
    );


  const estado =
    document.querySelector(
      "#estado"
    );



  const botones = [

    btnGeneratriz,
    btnGirar,
    btnDetener,
    btnSolido,
    btnReiniciar

  ];



  /* ===================================================== */
  /* AJUSTES DEL EFECTO                                    */
  /* ===================================================== */


  /*
  1.2 segundos por vuelta.

  Se ve rápido,
  pero todavía permite observar
  cómo gira la figura.
  */

  const VELOCIDAD_GIRO =
    1200;



  /*
  Cada 80 milisegundos
  creamos un rastro.
  */

  const INTERVALO_RASTRO =
    80;



  /*
  Cada rastro desaparece
  en 560 milisegundos.
  */

  const DURACION_RASTRO =
    560;



  /*
  Transparencia inicial
  de cada fantasma.
  */

  const OPACIDAD_RASTRO =
    0.24;



  /* ===================================================== */
  /* CONFIGURAR ESCENAS                                    */
  /* ===================================================== */


  const escenas = {



    /* --------------------------------------------------- */
    /* SEMICÍRCULO                                         */
    /* --------------------------------------------------- */

    semicirculo: {

      nombre:
        "Semicírculo",

      solido:
        "Esfera",

      target:
        document.querySelector(
          "#targetSemicirculo"
        ),

      rotor:
        document.querySelector(
          "#rotorSemicirculo"
        ),

      figura:
        document.querySelector(
          "#figuraSemicirculo"
        ),

      generatriz:
        document.querySelector(
          "#generatrizSemicirculo"
        ),

      eje:
        document.querySelector(
          "#ejeSemicirculo"
        ),

      textoEje:
        document.querySelector(
          "#textoEjeSemicirculo"
        ),

      rastros:
        document.querySelector(
          "#rastrosSemicirculo"
        ),

      solido3D:
        document.querySelector(
          "#solidoSemicirculo"
        ),

      relleno:
        document.querySelector(
          "#rellenoSemicirculo"
        ),

      resultado:
        document.querySelector(
          "#resultadoSemicirculo"
        ),

      timerRastro:
        null,

      girando:
        false

    },



    /* --------------------------------------------------- */
    /* RECTÁNGULO                                          */
    /* --------------------------------------------------- */

    rectangulo: {

      nombre:
        "Rectángulo",

      solido:
        "Cilindro",

      target:
        document.querySelector(
          "#targetRectangulo"
        ),

      rotor:
        document.querySelector(
          "#rotorRectangulo"
        ),

      figura:
        document.querySelector(
          "#figuraRectangulo"
        ),

      generatriz:
        document.querySelector(
          "#generatrizRectangulo"
        ),

      eje:
        document.querySelector(
          "#ejeRectangulo"
        ),

      textoEje:
        document.querySelector(
          "#textoEjeRectangulo"
        ),

      rastros:
        document.querySelector(
          "#rastrosRectangulo"
        ),

      solido3D:
        document.querySelector(
          "#solidoRectangulo"
        ),

      relleno:
        document.querySelector(
          "#rellenoRectangulo"
        ),

      resultado:
        document.querySelector(
          "#resultadoRectangulo"
        ),

      timerRastro:
        null,

      girando:
        false

    },



    /* --------------------------------------------------- */
    /* TRIÁNGULO                                           */
    /* --------------------------------------------------- */

    triangulo: {

      nombre:
        "Triángulo",

      solido:
        "Cono",

      target:
        document.querySelector(
          "#targetTriangulo"
        ),

      rotor:
        document.querySelector(
          "#rotorTriangulo"
        ),

      figura:
        document.querySelector(
          "#figuraTriangulo"
        ),

      generatriz:
        document.querySelector(
          "#generatrizTriangulo"
        ),

      eje:
        document.querySelector(
          "#ejeTriangulo"
        ),

      textoEje:
        document.querySelector(
          "#textoEjeTriangulo"
        ),

      rastros:
        document.querySelector(
          "#rastrosTriangulo"
        ),

      solido3D:
        document.querySelector(
          "#solidoTriangulo"
        ),

      relleno:
        document.querySelector(
          "#rellenoTriangulo"
        ),

      resultado:
        document.querySelector(
          "#resultadoTriangulo"
        ),

      timerRastro:
        null,

      girando:
        false

    }


  };



  /*
  Aquí guardamos el target
  que está viendo la cámara.
  */

  let escenaActual =
    null;



  /* ===================================================== */
  /* BOTONES ACTIVOS / INACTIVOS                           */
  /* ===================================================== */


  function habilitarBotones(
    activo
  ) {


    botones.forEach(

      boton => {


        boton.disabled =
          !activo;


      }

    );


  }



  /* ===================================================== */
  /* MOSTRAR GENERATRIZ                                    */
  /* ===================================================== */


  function mostrarGeneratriz(
    escena
  ) {


    if (!escena) {

      return;

    }



    escena.generatriz.setAttribute(

      "visible",

      true

    );


    escena.eje.setAttribute(

      "visible",

      true

    );


    escena.textoEje.setAttribute(

      "visible",

      true

    );



    estado.textContent =

      "Observa la generatriz y el eje de giro";


  }



  /* ===================================================== */
  /* LIMPIAR RASTROS                                       */
  /* ===================================================== */


  function limpiarRastros(
    escena
  ) {


    if (!escena) {

      return;

    }



    const contenedor =
      escena.rastros.object3D;



    while (
      contenedor.children.length > 0
    ) {


      contenedor.remove(

        contenedor.children[0]

      );


    }


  }



  /* ===================================================== */
  /* CREAR UNA COPIA FANTASMA                              */
  /* ===================================================== */


  function crearRastro(
    escena
  ) {


    if (
      !escena ||
      !escena.figura.object3D
    ) {

      return;

    }



    /*
    Copiamos solamente la FIGURA,
    no el sólido final.
    */

    const copiaFigura =
      escena.figura.object3D.clone(
        true
      );



    /*
    Cada copia necesita sus
    propios materiales.
    */

    const materiales =
      [];



    copiaFigura.traverse(

      objeto => {


        if (
          objeto.material
        ) {


          objeto.material =
            objeto.material.clone();


          objeto.material.transparent =
            true;


          objeto.material.opacity =
            OPACIDAD_RASTRO;


          materiales.push(
            objeto.material
          );


        }


      }

    );



    /*
    Creamos un grupo.

    El grupo reproduce exactamente
    la rotación que tenía la figura
    en ese instante.
    */

    const fantasma =
      new THREE.Group();



    fantasma.rotation.copy(

      escena.rotor.object3D.rotation

    );



    fantasma.add(

      copiaFigura

    );



    escena.rastros.object3D.add(

      fantasma

    );



    /*
    Momento en que aparece
    el rastro.
    */

    const inicio =
      performance.now();



    /*
    Desvanecimiento.
    */

    function desaparecer(
      ahora
    ) {


      const progreso =

        (
          ahora -
          inicio
        )

        /

        DURACION_RASTRO;



      const opacidad =

        Math.max(

          0,

          OPACIDAD_RASTRO *
          (
            1 -
            progreso
          )

        );



      materiales.forEach(

        material => {


          material.opacity =
            opacidad;


        }

      );



      if (
        progreso <
        1
      ) {


        requestAnimationFrame(
          desaparecer
        );


      }

      else {


        escena.rastros.object3D.remove(

          fantasma

        );


      }


    }



    requestAnimationFrame(

      desaparecer

    );


  }



  /* ===================================================== */
  /* DETENER MOTOR                                         */
  /* ===================================================== */


  function detenerMotor(
    escena
  ) {


    if (!escena) {

      return;

    }



    escena.rotor.removeAttribute(

      "animation__giro"

    );



    if (
      escena.timerRastro
    ) {


      clearInterval(

        escena.timerRastro

      );


      escena.timerRastro =
        null;


    }



    escena.girando =
      false;


  }



  /* ===================================================== */
  /* GIRAR                                                 */
  /* ===================================================== */


  function girar(
    escena
  ) {


    if (!escena) {

      return;

    }



    /*
    Si ya estaba girando,
    detenemos la animación anterior.
    */

    detenerMotor(
      escena
    );



    /*
    Empezamos desde cero.
    */

    escena.rotor.setAttribute(

      "rotation",

      "0 0 0"

    );



    limpiarRastros(
      escena
    );



    /*
    Durante el giro:

    NO mostramos todavía
    el sólido final.
    */

    escena.solido3D.setAttribute(

      "visible",

      false

    );


    escena.resultado.setAttribute(

      "visible",

      false

    );



    /*
    Sí mostramos la generatriz
    y el eje.
    */

    mostrarGeneratriz(
      escena
    );



    /*
    GIRO RÁPIDO
    */

    escena.rotor.setAttribute(

      "animation__giro",

      {

        property:
          "rotation",

        from:
          "0 0 0",

        to:
          "0 360 0",

        dur:
          VELOCIDAD_GIRO,

        easing:
          "linear",

        loop:
          true

      }

    );



    /*
    Efecto de barrido.
    */

    escena.timerRastro =
      setInterval(

        () => {


          crearRastro(
            escena
          );


        },

        INTERVALO_RASTRO

      );



    escena.girando =
      true;



    estado.textContent =

      escena.nombre

      +

      " girando... observa el barrido";


  }



  /* ===================================================== */
  /* DETENER                                               */
  /* ===================================================== */


  function detener(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    /*
    NO revelamos todavía
    el sólido final.

    Esa es función del botón
    VER SÓLIDO.
    */

    escena.solido3D.setAttribute(

      "visible",

      false

    );


    escena.resultado.setAttribute(

      "visible",

      false

    );



    estado.textContent =

      "Giro detenido. ¿Qué sólido se formó?";


  }



  /* ===================================================== */
  /* VER SÓLIDO                                            */
  /* ===================================================== */


  function verSolido(
    escena
  ) {


    if (!escena) {

      return;

    }



    /*
    Si el estudiante pulsa
    VER SÓLIDO mientras gira,
    primero detenemos.
    */

    detenerMotor(
      escena
    );



    /*
    Dejamos desaparecer los
    últimos rastros naturalmente.
    */



    /*
    Hacemos visible el sólido.
    */

    escena.solido3D.setAttribute(

      "visible",

      true

    );



    /*
    Reiniciamos la opacidad
    para crear un efecto
    de aparición.
    */

    escena.relleno.setAttribute(

      "material",

      "opacity",

      0.05

    );



    /*
    El sólido aparece
    progresivamente.
    */

    escena.relleno.setAttribute(

      "animation__aparecer",

      {

        property:
          "material.opacity",

        from:
          0.05,

        to:
          0.48,

        dur:
          650,

        easing:
          "easeOutQuad"

      }

    );



    escena.resultado.setAttribute(

      "visible",

      true

    );



    estado.textContent =

      "Resultado: "

      +

      escena.solido;


  }



  /* ===================================================== */
  /* REINICIAR                                             */
  /* ===================================================== */


  function reiniciarEscena(
    escena
  ) {


    if (!escena) {

      return;

    }



    detenerMotor(
      escena
    );



    limpiarRastros(
      escena
    );



    escena.rotor.setAttribute(

      "rotation",

      "0 0 0"

    );



    escena.generatriz.setAttribute(

      "visible",

      false

    );


    escena.eje.setAttribute(

      "visible",

      false

    );


    escena.textoEje.setAttribute(

      "visible",

      false

    );



    escena.solido3D.setAttribute(

      "visible",

      false

    );



    escena.resultado.setAttribute(

      "visible",

      false

    );



    escena.relleno.removeAttribute(

      "animation__aparecer"

    );



    estado.textContent =

      escena.nombre

      +

      " detectado ✓";


  }



  /* ===================================================== */
  /* EVENTOS DE MINDAR                                     */
  /* ===================================================== */


  function prepararTarget(
    escena
  ) {


    /*
    TARGET ENCONTRADO
    */

    escena.target.addEventListener(

      "targetFound",

      () => {


        escenaActual =
          escena;


        habilitarBotones(
          true
        );


        estado.textContent =

          escena.nombre

          +

          " detectado ✓";


      }

    );



    /*
    TARGET PERDIDO
    */

    escena.target.addEventListener(

      "targetLost",

      () => {


        if (
          escenaActual ===
          escena
        ) {


          reiniciarEscena(
            escena
          );


          escenaActual =
            null;


          habilitarBotones(
            false
          );


          estado.textContent =

            "Enfoca una de las tres figuras";


        }


      }

    );


  }



  /* ===================================================== */
  /* PREPARAR LOS TRES TARGETS                              */
  /* ===================================================== */


  prepararTarget(

    escenas.semicirculo

  );


  prepararTarget(

    escenas.rectangulo

  );


  prepararTarget(

    escenas.triangulo

  );



  /* ===================================================== */
  /* ACCIONES DE BOTONES                                    */
  /* ===================================================== */


  btnGeneratriz.addEventListener(

    "click",

    () => {


      mostrarGeneratriz(

        escenaActual

      );


    }

  );



  btnGirar.addEventListener(

    "click",

    () => {


      girar(

        escenaActual

      );


    }

  );



  btnDetener.addEventListener(

    "click",

    () => {


      detener(

        escenaActual

      );


    }

  );



  btnSolido.addEventListener(

    "click",

    () => {


      verSolido(

        escenaActual

      );


    }

  );



  btnReiniciar.addEventListener(

    "click",

    () => {


      reiniciarEscena(

        escenaActual

      );


    }

  );



  /* ===================================================== */
  /* ESTADO INICIAL                                        */
  /* ===================================================== */


  habilitarBotones(

    false

  );


</script>
